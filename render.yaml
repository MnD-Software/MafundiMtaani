services:
  - type: web
    name: mafundi-mtaani-api
    runtime: python
    rootDir: services/api
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: MAFUNDI_ENVIRONMENT
        value: production
      - key: MAFUNDI_DATABASE_URL
        fromDatabase:
          name: mafundi-mtaani-db
          property: connectionString
      - key: MAFUNDI_JWT_SECRET
        generateValue: true
      - key: MAFUNDI_CORS_ORIGINS
        sync: false

databases:
  - name: mafundi-mtaani-db
    databaseName: mafundi
    user: mafundi
    plan: free
